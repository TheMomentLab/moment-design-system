name: Moment Design System
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - run: npm run build:storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run check:moment:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moment-storybook-and-evidence
          path: |
            storybook-moment
            artifacts/moment
            docs/moment/verification.json
