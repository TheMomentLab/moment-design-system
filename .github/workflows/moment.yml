name: Moment Design System
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - run: npm run build:storybook
      - run: npm run check:moment:catalog
      - run: node packages/moment/inherited/conformance/src/cli.mjs verify-fixtures
      - run: npx playwright install --with-deps chromium
      - run: npm run check:moment:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moment-storybook-and-evidence
          path: |
            storybook-moment
            artifacts/moment
            docs/moment/verification.json
  inherited:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run check:moment:inherited-browser
        env:
          A11Y_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inherited-evidence-${{ matrix.shard }}
          path: artifacts/moment/inherited-accessibility
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:moment:consumer
        env:
          MDS_REACT_MAJOR: ${{ matrix.react }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-evidence-react-${{ matrix.react }}
          path: artifacts/moment
